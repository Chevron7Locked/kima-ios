name: bug report
description: something in the app doesn't work
labels: ["bug"]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: what happened
      placeholder: what you saw
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: steps to make it happen
      placeholder: |
        1. open …
        2. tap …
  - type: textarea
    id: expected
    attributes:
      label: what you expected
  - type: input
    id: app-version
    attributes:
      label: app version
      description: more › settings › about › version
      placeholder: 0.1.0 (10)
  - type: input
    id: ios-version
    attributes:
      label: ios version
      placeholder: iOS 26.0
  - type: input
    id: device
    attributes:
      label: device
      placeholder: iPhone17,1
  - type: input
    id: screen
    attributes:
      label: screen
      description: the tab you were on
      placeholder: home
